name: Deploy to Firebase Hosting on Push

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      # Firestore steps are skipped until the project is actually configured, so
      # this workflow keeps working unchanged before the backend exists.
      # `secrets` cannot be referenced from a step-level `if`, hence the promotion
      # to a job-level env var here.
      FIRESTORE_CONFIGURED: ${{ secrets.VITE_FIREBASE_PROJECT_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22+ is required: @testing-library/jest-dom@7 and concurrently@10
          # both declare engines >=22, and node:sqlite (used by the dev server
          # and its tests) is only stable from 22.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pushes to main deploy straight to the live channel, so a broken commit
      # would otherwise reach production unchecked. The Firestore emulator
      # suites skip themselves when no emulator is running.
      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build
        env:
          # PostHog project key (publishable, write-only). Stored as a repo
          # Actions secret so it stays out of source. Vite bakes it into the
          # bundle at build time; host falls back to US cloud when unset.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # Firebase web config — publishable client identifiers, not secrets
          # (firestore.rules is the security boundary). Until these are set the
          # site serves bundled data and the join form honestly reports that
          # nothing was saved. See docs/DEPLOYMENT.md.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # FormSubmit alias that new-member notifications are delivered to. A
          # secret rather than a committed constant so the destination can be
          # repointed without a code change. Unset means no notification is sent.
          VITE_NOTIFY_TARGET: ${{ secrets.VITE_NOTIFY_TARGET }}

      # firestore.rules is generated from src/data/onboardingOptions.ts, so it can
      # only be trusted if it matches that data (checked by the drift test in
      # `npm test`) AND actually behaves (checked here against the emulator).
      # These 47 tests are the gate on auto-deploying security rules.
      # The Firestore emulator runs on the JVM and firebase-tools requires JDK 21+,
      # which is newer than the ubuntu runner's default.
      - name: Set up Java for the Firestore emulator
        if: env.FIRESTORE_CONFIGURED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test Firestore rules against the emulator
        if: env.FIRESTORE_CONFIGURED == 'true'
        run: npm run test:rules

      # Rules live inside Firestore, not in Hosting, so shipping the frontend
      # does not update them. Without this step the enforced rules silently lag
      # the code — e.g. adding a country would leave every signup from it
      # rejected by stale rules. Deployed BEFORE hosting so the frontend never
      # offers something the rules still refuse.
      - name: Deploy Firestore rules and indexes
        if: env.FIRESTORE_CONFIGURED == 'true'
        env:
          # Passed via env, never interpolated into the shell, so the JSON cannot
          # break out of the command.
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          CREDS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$CREDS"
          trap 'rm -f "$CREDS"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$CREDS" \
            npx firebase deploy \
              --only firestore:rules,firestore:indexes \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: raif-af800
          channelId: live
